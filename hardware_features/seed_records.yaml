  - schema_version: hardware_feature_record_v1
    record_id: nvidia.blackwell.tensor_cores.precision_policy
    title: Blackwell Tensor Core precision policy
    summary_text: Blackwell normal mode permits TF32, BF16 AMP, and FP16 AMP; aggressive mode additionally permits explicit Transformer Engine FP8, MXFP8, and NVFP4 training recipes without recommending them automatically.
    detail_text: Use torch.amp TF32, BF16, or FP16 paths in normal mode. Aggressive mode may test FP8, MXFP8BlockScaling, or NVFP4BlockScaling only when Transformer Engine, the model modules, tensor shapes, and packages are compatible and a BF16 or FP16 fallback remains available. Generic FP4 and MXFP4 are not NVFP4 training evidence.
    vendor: nvidia
    architectures: [blackwell]
    accelerator_names: [rtx_5090, geforce_rtx_5090]
    compute_capabilities: ["12.0"]
    toolkits: [cuda]
    frameworks: [pytorch]
    workload_types: [vision_training, transformer_training, inference]
    features: [tensor_cores, amp, tf32, bf16, fp16, fp8, mxfp8, nvfp4]
    recommended_patterns:
      - In normal mode, use TF32 or torch.amp autocast with BF16 or FP16 selected from hardware and framework context.
      - Use GradScaler for fp16 training and make it optional for bf16 training.
      - Keep a full-precision fallback path for numerically fragile losses or metrics.
      - In aggressive mode, treat FP8, MXFP8, and NVFP4 as opt-in experiments that require an explicit compatible Transformer Engine recipe and end-to-end measurement.
    avoid_patterns:
      - Do not blindly enable every low-precision mode at once.
      - Do not treat generic FP4, MXFP4, inference quantization, or the text fp4 as NVFP4 training.
    source_refs:
      - title: NVIDIA Transformer Engine MXFP8 training
        url: https://docs.nvidia.com/deeplearning/transformer-engine/user-guide/features/low_precision_training/mxfp8/mxfp8.html
        source_type: vendor_documentation
        retrieved_or_verified_date: "2026-08-19"
