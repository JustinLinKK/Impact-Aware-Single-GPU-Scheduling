        url: https://docs.nvidia.com/deeplearning/transformer-engine-releases/release-2.14/user-guide/features/low_precision_training/nvfp4/nvfp4.html
        source_type: vendor_documentation
        retrieved_or_verified_date: "2026-08-19"
    confidence: 0.94
    last_verified: "2026-08-19"
