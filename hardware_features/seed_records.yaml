  - schema_version: hardware_feature_record_v1
    record_id: nvidia.ada_hopper.fp8.training_policy
    title: Ada and Hopper FP8 training policy
    summary_text: Ada SM 8.9 and Hopper SM 9.0 have native FP8 Tensor Cores, and MLEvolve exposes FP8 training only in aggressive mode through a validated Transformer Engine E4M3 or HYBRID recipe.
    detail_text: FP8 is hardware-native on Ada and later, including Ada rather than only Hopper. It still requires compatible Transformer Engine modules, supported tensor shapes, an installed software stack, and end-to-end accuracy and speed validation. E4M3 can be used by a documented recipe; E5M2 is only the backward-gradient component of the HYBRID recipe and is not an independent training policy. Keep BF16 or FP16 as the fallback.
    vendor: nvidia
    architectures: [ada_lovelace, hopper]
    accelerator_names: [geforce_rtx_4090, l40s, h100, h200]
    compute_capabilities: ["8.9", "9.0"]
    toolkits: [cuda, transformer_engine]
    frameworks: [pytorch]
    workload_types: [transformer_training, generative_ai]
    features: [tensor_cores, fp8, fp8_e4m3, fp8_hybrid]
    recommended_patterns:
      - In aggressive mode, use an explicit Transformer Engine E4M3 or HYBRID forward/backward recipe and benchmark it against BF16 or FP16.
      - Keep a BF16 or FP16 fallback when model modules, tensor shapes, packages, speed, or accuracy do not validate.
    avoid_patterns:
      - Do not enable FP8 in normal mode.
      - Do not select pure E5M2 as the end-to-end training policy.
    source_refs:
      - title: NVIDIA Ada GPU architecture tuning guide
        url: https://docs.nvidia.com/cuda/archive/12.9.2/ada-tuning-guide/index.html
