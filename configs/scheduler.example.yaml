runtime_root: "./localml_scheduler/runtime"
scheduler_poll_interval_seconds: 0.2
command_poll_limit: 100
aging_interval_seconds: 120
aging_priority_increment: 1
enable_priority_aging: true
preempt_check_interval_seconds: 0.2
baseline_cache:
  warm_queue_policy: "top_k"
  warm_queue_top_k: 2
  entry_capacity: 8
  max_ram_percent: 0.20
  memory_budget_bytes: 536870912
cache_server_host: "127.0.0.1"
cache_server_port: 8765
cache_socket_name: "cache_server.sock"
auto_resume_recoverable: false
prediction:
  # "branch_profile" uses observations/probes; "ml_predictor" first tries PerfSeer.
  mode: "branch_profile"
  ml:
    registry_path: null
    source_conversion_timeout_seconds: 15
    cache_size: 1024
    # Test-only cross-hardware bypass. Both fields are required to activate it.
    test_override_enabled: false
    test_model_path: null
graph_db:
  enabled: true
  mode: "primary"
  provider: "neo4j"
  uri: "bolt://127.0.0.1:7687"
  username: "neo4j"
  password_env: "LOCALML_SCHEDULER_NEO4J_PASSWORD"
  database: "neo4j"
  bootstrap_constraints: true
  auto_import_legacy_sqlite: true
  legacy_sqlite_path: null
  allow_legacy_fallback: true
hardware_feature_db:
  enabled: true
  provider: "qdrant"
  url: "http://127.0.0.1:6333"
  api_key_env: "LOCALML_SCHEDULER_QDRANT_API_KEY"
  collection_name: "hardware_feature_knowledge"
  code_doc_collection_name: "code_doc_chunks"
  optimization_recipe_collection_name: "optimization_recipe_chunks"
  api_symbol_collection_name: "api_symbol_chunks"
  embedding_model_type: "local"
  embedding_model_name: "BAAI/bge-base-en-v1.5"
  embedding_device: "cpu"
  distance: "Cosine"
log_db:
  provider: "postgres"
  dsn_env: "LOCALML_SCHEDULER_LOG_DSN"
  schema: "scheduler_logs"
  # Analytics only. Missing or unreachable Postgres should not block the scheduler.
  enabled: false
gpu_scheduler:
  enabled: true
  mode: "parallel_time_aware"
  backend_priority: ["mps", "stream", "cuda_process", "exclusive"]
  # null is unlimited. Legacy max_packed_jobs_per_gpu is still accepted when this is absent.
  parallel_job_cap: null
  priority_window_size: 8
  oldest_window_size: 4
  starvation_timeout_seconds: 1800
  beam_width: 64
  exact_search_max_jobs: 3
  fallback_cooldown_seconds: 900
  batch_probe_enabled: true
  batch_probe_target_memory_fraction: 0.97
  batch_probe_min_batch_size: 1
  batch_probe_max_search_rounds: 12
  batch_probe_max_batch_size: null
  batch_probe_search_mode: "binary"
  profiling:
    warmup_steps: 30
    solo_probe_steps: 80
    pair_probe_steps: 60
    reuse_profile_if_confidence_ge: 0.8
  memory:
    gpu_vram_gib: null
    predicted_budget_fraction: 0.85
    live_admission_stop_fraction: 0.90
    live_admission_resume_fraction: 0.85
    admission_average_window_seconds: 10
  objective:
    priority_weight: 0.10
    objective_version: "time_v3_flow_only"
  batch_options:
    exponent_offsets: [-2, -1, 0, 1, 2]
    require_power_of_two_original: true
  exclusive_probe:
    enabled: true
    drain_without_preemption: true
  thresholds:
    pack_reject_max_slowdown: 1.30  # reserved; ignored by live placement
  telemetry:
    device_poll_ms: 500
    pair_recheck_every_steps: 20
  submission_defaults:
    requires_gpu: true
    estimated_vram_mb: null
    estimated_avg_vram_mb: null
    estimated_ram_mb: null
    packing_eligible: false
    packing_family: "mlevolve_script"
    packing_max_slowdown_ratio: null
    backend_allowlist: ["mps", "cuda_process"]
    batch_probe_enabled: true
    batch_probe_model_key: null
    batch_probe_probe_timeout_seconds: 45
    batch_probe_poll_interval_seconds: 0.5
    batch_probe_max_multiplier: 32
    batch_probe_search_mode: "binary"
    runtime_probe_enabled: true
    runtime_probe_target: null
    runtime_probe_model_key: null
    runtime_probe_strategy: "epoch_1"
  mps:
    enabled: false
    compute_mode: "EXCLUSIVE_PROCESS"
    default_primary_active_thread_pct: 60
    default_secondary_active_thread_pct: 40
    default_omp_num_threads: 6
    default_mkl_num_threads: 6
    pipe_directory: "/tmp/nvidia-mps"
    log_directory: "/tmp/nvidia-mps-log"
  cuda_process:
    enabled: true
    default_omp_num_threads: 6
    default_mkl_num_threads: 6
  stream:
    enabled: false
    host_poll_interval_seconds: 0.1
    host_join_timeout_seconds: 3.0
early_stopping:
  enabled: false
  metric_name: "accuracy"
  mode: "max"
  patience_epochs: 5
  min_delta: 0.0
  min_epochs: 1
  save_best_checkpoint: true
  restore_best_checkpoint: false
  missing_metric_policy: "ignore"
